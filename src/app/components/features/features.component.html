<section class="features">
  <div class="container">
    <div class="features-grid">
      <div class="feature-card" *ngFor="let feature of features">
        <div class="feature-icon">
          <svg *ngIf="feature.icon === 'medical'" width="48" height="48" viewBox="0 0 48 48" fill="none">
            <path d="M24 8L30 20H18L24 8Z" stroke="#95785A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="24" cy="32" r="8" stroke="#95785A" stroke-width="2"/>
          </svg>
          <svg *ngIf="feature.icon === 'safety'" width="48" height="48" viewBox="0 0 48 48" fill="none">
            <path d="M24 4L8 12V22C8 32 16 40 24 44C32 40 40 32 40 22V12L24 4Z" stroke="#95785A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M18 24L22 28L30 20" stroke="#95785A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg *ngIf="feature.icon === 'approach'" width="48" height="48" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="16" r="8" stroke="#95785A" stroke-width="2"/>
            <path d="M8 40C8 32 15 26 24 26C33 26 40 32 40 40" stroke="#95785A" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <svg *ngIf="feature.icon === 'comfort'" width="48" height="48" viewBox="0 0 48 48" fill="none">
            <path d="M24 4L28 18H42L31 26L35 40L24 32L13 40L17 26L6 18H20L24 4Z" stroke="#95785A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h3 class="feature-title">{{ feature.title }}</h3>
        <p class="feature-description">{{ feature.description }}</p>
      </div>
    </div>
  </div>
</section>
