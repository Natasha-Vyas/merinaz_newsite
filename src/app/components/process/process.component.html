<section class="process">
  <div class="container">
    <h2 class="section-title" *ngIf="steps.length > 0">Our Process</h2>

    <div class="process-grid" *ngIf="steps.length > 0">
      <div class="process-step" *ngFor="let step of steps; let i = index">
        <div class="step-icon">
          <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
            <circle cx="30" cy="30" r="28" stroke="#95785A" stroke-width="2"/>
            <text x="30" y="38" text-anchor="middle" fill="#95785A" font-size="18" font-weight="600">{{ i + 1 }}</text>
          </svg>
        </div>
        <h3 class="step-title">{{ step.title }}</h3>
        <p class="step-description">{{ step.description }}</p>
        <div class="step-connector" *ngIf="i < steps.length - 1">
          <svg width="100%" height="2" viewBox="0 0 100 2">
            <line x1="0" y1="1" x2="100" y2="1" stroke="#95785A" stroke-width="2" stroke-dasharray="5,5"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
</section>
