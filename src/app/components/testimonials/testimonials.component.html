<section class="testimonials">
  <div class="testimonials-container">
    <div class="testimonials-heading">
      <div class="heading-left">
        <h2 class="section-title">Client Reviews</h2>
        <p class="section-subtitle">Hear from our satisfied customers</p>
      </div>
      <a href="https://www.google.com/search?q=Merinaz+1768+Columbia+Rd+NW%2C+Floor+2+Washington+DC%2C+20009" target="_blank" class="google-review-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <div class="google-info">
          <span class="google-rating">4.9 ★★★★★</span>
          <span class="google-label">Google Reviews</span>
        </div>
      </a>
    </div>

    <div class="testimonials-viewport" *ngIf="testimonials.length > 0">
      <div class="testimonials-track">
        <div class="testimonials-set">
          <div class="testimonial-card" *ngFor="let testimonial of testimonials; let i = index">
            <div class="card-header">
              <div class="rating-badge">
                <span class="rating-number">5.0</span>
                <div class="stars">
                  <svg *ngFor="let star of testimonial.stars" width="16" height="16" viewBox="0 0 20 20" fill="none">
                    <path d="M10 0L12.2451 6.90983L19.5106 7.72949L14.5451 12.3402L15.8779 19.5205L10 15.9L4.12215 19.5205L5.45492 12.3402L0.489435 7.72949L7.75486 6.90983L10 0Z" fill="#FFB800"/>
                  </svg>
                </div>
              </div>
            </div>

            <p class="testimonial-quote">"{{ testimonial.quote }}"</p>

            <div class="testimonial-footer">
              <div class="author-info">
                <div class="author-avatar">
                  <img [src]="getReviewerAvatar(i)" [alt]="testimonial.name + ' reviewer avatar'" loading="lazy">
                </div>
                <div class="author-details">
                  <h4 class="author-name">{{ testimonial.name }}</h4>
                  <p class="author-label">Verified Client</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="testimonials-set" aria-hidden="true">
          <div class="testimonial-card" *ngFor="let testimonial of testimonials; let i = index">
            <div class="card-header">
              <div class="rating-badge">
                <span class="rating-number">5.0</span>
                <div class="stars">
                  <svg *ngFor="let star of testimonial.stars" width="16" height="16" viewBox="0 0 20 20" fill="none">
                    <path d="M10 0L12.2451 6.90983L19.5106 7.72949L14.5451 12.3402L15.8779 19.5205L10 15.9L4.12215 19.5205L5.45492 12.3402L0.489435 7.72949L7.75486 6.90983L10 0Z" fill="#FFB800"/>
                  </svg>
                </div>
              </div>
            </div>

            <p class="testimonial-quote">"{{ testimonial.quote }}"</p>

            <div class="testimonial-footer">
              <div class="author-info">
                <div class="author-avatar">
                  <img [src]="getReviewerAvatar(i)" alt="" loading="lazy">
                </div>
                <div class="author-details">
                  <h4 class="author-name">{{ testimonial.name }}</h4>
                  <p class="author-label">Verified Client</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>
